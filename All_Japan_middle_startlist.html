<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタートリスト</title>
<style>
:root{
  --fg:#222; --bg:#fff; --line:#999; --muted:#666;
  --panel:#f6f6f6; --accent:#2a6db0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:"Noto Sans CJK JP","Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:13px;line-height:1.35}
body{padding:12px 16px}
h1{font-size:18px;margin:0 0 6px}
.sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.panel{background:var(--panel);border:1px solid #ddd;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.row+.row{margin-top:6px}
label{white-space:nowrap}
input[type=text],input[type=number],select{font:inherit;padding:3px 5px;border:1px solid #bbb;border-radius:4px;background:#fff}
input[type=number]{width:56px}
button{font:inherit;padding:4px 10px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:hover{filter:brightness(0.95)}
details summary{cursor:pointer;font-weight:bold}
.classbox{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.classbox label{font-size:12px}
.colorgrid{display:grid;grid-template-columns:max-content max-content max-content;gap:3px 14px;align-items:center;margin-top:6px;font-size:12px}
.colorgrid .hd{font-weight:bold;color:var(--muted)}
.cp{display:inline-flex;align-items:center;gap:4px}
.cp input[type=color]{width:34px;height:22px;padding:0;border:1px solid #bbb;background:none}
.cp input[type=text]{width:6.5em;font-family:monospace;font-size:12px;padding:2px 4px}
.cp input.bad{border-color:#d33;background:#fff0f0}
.status{font-size:12px;color:var(--muted);margin:4px 0}
.mine{font-weight:bold;outline:2px solid #e8a000;outline-offset:-2px}

table{border-collapse:collapse;width:auto;max-width:100%;table-layout:fixed}
th,td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
thead th{background:#eee;cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
thead th .arrow{color:var(--accent);font-size:11px;margin-left:3px}
thead tr.filters th{background:#fafafa;cursor:default;padding:2px 3px;top:26px}
thead tr.filters input{width:100%;font-size:12px;padding:2px 4px;border:1px solid #ccc;border-radius:3px}
tr.gtitle td{font-weight:bold;font-size:14px;padding:5px 6px;border-top:2px solid #555}
tr.gtitle td .cnt{font-weight:normal;font-size:12px;color:#444;margin-left:10px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.time{font-variant-numeric:tabular-nums;font-weight:600}
td.center{text-align:center}
.col-time{width:8.5em}.col-name{width:12em}.col-kana{width:12em}.col-club{width:var(--clubw,16em)}.col-card{width:7.5em}.col-note{width:9em}.col-cls{width:6em}.col-bus{width:5em}
.empty{padding:20px;color:var(--muted);text-align:center}

@media print{
  @page{size:A4 portrait;margin:12mm 9mm}
  body{padding:0;font-size:9.5pt}
  thead th{font-size:8.5pt}
  .noprint{display:none !important}
  h1{font-size:15pt}
  table{page-break-inside:auto;width:100%}
  thead{display:table-header-group}
  thead th{position:static;background:#e6e6e6 !important}
  tr{page-break-inside:avoid}
  tr.gtitle{page-break-after:avoid}
  th,td{padding:2px 5px;white-space:normal;word-break:break-all}
  thead th{white-space:nowrap}
  .col-time{width:10%}.col-name{width:17%}.col-club{width:28%}.col-kana{width:19%}.col-card{width:11%}.col-note{width:15%}
  table.hasbus .col-time{width:9%}table.hasbus .col-name{width:16%}table.hasbus .col-club{width:25%}table.hasbus .col-kana{width:19%}table.hasbus .col-card{width:10.5%}table.hasbus .col-note{width:13.5%}table.hasbus .col-bus{width:7%}
  table.busmode .col-kana{width:20%}table.busmode .col-name{width:16%}table.busmode .col-cls{width:8%}table.busmode .col-time{width:8%}table.busmode .col-club{width:25%}table.busmode .col-card{width:10.5%}table.busmode .col-note{width:12.5%}
  .mine{outline:none;font-weight:bold}
  td,th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="sub" id="subtitle"></div>

<div class="panel noprint">
  <div class="row">
    <b>表示モード：</b>
    <label><input type="radio" name="mode" value="cls" checked> クラス別</label>
    <label><input type="radio" name="mode" value="course" id="modeCourse"> レーン別</label>
    <label><input type="radio" name="mode" value="bus" id="modeBus"> バス利用者（ふりがな順）</label>
    <span id="modeNote" class="status"></span>
    <span style="flex:1"></span>
    <button class="primary" onclick="window.print()">PDF化／印刷（A4）</button>
  </div>
  <div class="row">
    <label>自分の名前：<input type="text" id="myName" list="nameList" placeholder="氏名を入力・選択" style="width:14em"></label>
    <datalist id="nameList"></datalist>
    <button onclick="setMyName('')">クリア</button>
    <label><input type="checkbox" id="winOn"> 自分の前後 <input type="number" id="winMin" value="10" min="0" max="180"> 分のスタート者だけ表示</label>
  </div>
  <div class="row">
    <label>所属（部分一致）：<input type="text" id="clubQ" placeholder="例：OLC" style="width:12em"></label>
    <label>全項目検索（部分一致）：<input type="text" id="allQ" placeholder="氏名・所属・カード番号など" style="width:16em"></label>
    <button onclick="resetFilters()">フィルタ全解除</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="showKana"> ふりがなを表示</label>
    <label><input type="checkbox" id="busOnly"> バス利用者のみ</label>
    <span>カード（<label><input type="checkbox" id="cardMy" checked> マイカード</label>　<label><input type="checkbox" id="cardRental" checked> レンタル（マイカード以外）</label>）</span>
  </div>
  <details style="margin-top:6px">
    <summary>表示するクラス／レーンを選ぶ</summary>
    <div class="row" style="margin-top:4px"><button onclick="checkAllGroups(true)">すべて選択</button><button onclick="checkAllGroups(false)">すべて解除</button></div>
    <div class="classbox" id="groupChecks"></div>
  </details>
  <details style="margin-top:6px">
    <summary>色の設定（背景色・タイトル色）</summary>
    <div class="row" style="margin-top:4px" id="defColorRow"></div>
    <div class="colorgrid" id="colorGrid"></div>
  </details>
</div>
<div class="status noprint" id="status"></div>

<table id="tbl">
  <thead>
    <tr id="hdr"></tr>
    <tr class="filters noprint" id="flt"></tr>
  </thead>
  <tbody id="body"></tbody>
</table>

// ---------- 列定義 ----------
const COLDEF = {
  time:    {label:"スタート",   cls:"col-time", td:"time"},
  name:    {label:"氏名",       cls:"col-name"},
  club:    {label:"所属",       cls:"col-club"},
  kana:    {label:"ふりがな",   cls:"col-kana"},
  card:    {label:"カード番号", cls:"col-card", td:"num"},
  cardnote:{label:"カード備考", cls:"col-note"},
  cls:     {label:"クラス",     cls:"col-cls"},
  bus:     {label:"バス",   cls:"col-bus", td:"center"},
};
const hasBus = !!DATA.has.bus;
function colset(m){
  const kana = document.getElementById("showKana").checked;
  if(m==="bus") return ["kana","name","cls","time","club","card","cardnote"];
  return ["time","name"].concat(kana?["kana"]:[], ["club","card","cardnote"], hasBus?["bus"]:[]);
}
let COLS = [];

// ---------- 既定色 ----------
const DEF = {
  M:{stripe:"#eaf5fc", title:"#b9dcf2"},   // 男子：ごく薄い水色／薄め水色
  W:{stripe:"#fdeaf7", title:"#f3b9e2"},   // 女子：ごく薄いマゼンタ／薄めマゼンタ
  O:{stripe:"#f2f2f2", title:"#d5d5d5"},   // その他（初心者・混合・バス利用者リスト等）
};
let defColors = JSON.parse(JSON.stringify(DEF));
let groupColors = {};      // {group: {stripe, title}}  個別指定
const LS_KEY = "startlist-colors-v1";
try{ const s=localStorage.getItem(LS_KEY); if(s){const o=JSON.parse(s); defColors=o.def||defColors; groupColors=o.grp||{};} }catch(e){}
function saveColors(){ try{localStorage.setItem(LS_KEY, JSON.stringify({def:defColors, grp:groupColors}));}catch(e){} }

// ---------- 状態 ----------
const rows = DATA.rows.map((r,i)=>Object.assign({_i:i, _min:toMin(r.time)}, r));
const hasCourse = DATA.has.course && rows.some(r=>r.course);
let mode = "cls";
let sortKey = "time", sortAsc = true;
let colFilter = {};
let groupEnabled = {};
let myName = "";

function toMin(t){ if(!t) return null; const m=/^(\d{1,2}):(\d{2})/.exec(t); return m? (+m[1])*60+(+m[2]) : null; }
// フィルタ用のグループ（クラス or コース）。バス利用者リストではクラスで絞る
function groupOf(r){ return mode==="course" ? (r.course||"(コースなし)") : (r.cls||"(クラスなし)"); }
// 表示上のタイトル行グループ。バス利用者リストは1本のリスト
function titleOf(r){ return mode==="bus" ? "バス利用者" : groupOf(r); }
function genderOfGroup(g){
  if(g==="バス利用者") return "O";
  const members = rows.filter(r=>groupOf(r)===g);
  const gs = new Set(members.map(r=>(r.cls||"").charAt(0).toUpperCase()));
  if(gs.size===1 && gs.has("M")) return "M";
  if(gs.size===1 && gs.has("W")) return "W";
  const c=g.charAt(0).toUpperCase(); if(c==="M"||c==="W") return c;
  return "O";
}
function colorsOf(g){ const d=defColors[genderOfGroup(g)]; const o=groupColors[g]||{}; return {stripe:o.stripe||d.stripe, title:o.title||d.title}; }
function allGroups(){
  const seen=new Set(); rows.forEach(r=>seen.add(groupOf(r)));
  return [...seen].sort((a,b)=>a.localeCompare(b,"ja",{numeric:true}));
}
// タイトル行の表示名（コース別のときは「コース 3（M20A, W21A）」）
function titleLabel(g){
  if(mode!=="course") return g;
  const cs=[...new Set(rows.filter(r=>groupOf(r)===g).map(r=>r.cls).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja",{numeric:true}));
  return `レーン ${g}` + (cs.length? `（${cs.join(", ")}）` : "");
}
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function norm(s){ return String(s??"").toLowerCase().replace(/[Ａ-Ｚａ-ｚ０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[ァ-ン]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)); }
function isMyCard(r){ return /マイカード/.test(r.cardnote||""); }
function isBus(r){ return !!(r.bus && r.bus.trim() && !/^(0|no|false|-|×|x)$/i.test(r.bus.trim())); }

// ---------- 色入力（ピッカー＋16進テキスト） ----------
function colorPair(value, onChange){
  const w=document.createElement("span"); w.className="cp";
  const c=document.createElement("input"); c.type="color"; c.value=value;
  const t=document.createElement("input"); t.type="text"; t.value=value; t.placeholder="#rrggbb"; t.maxLength=7;
  c.oninput=()=>{ t.value=c.value; t.classList.remove("bad"); onChange(c.value); };
  t.oninput=()=>{ let v=t.value.trim(); if(/^[0-9a-f]{6}$/i.test(v)) v="#"+v;
    if(/^#[0-9a-f]{3}$/i.test(v)) v="#"+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
    if(/^#[0-9a-f]{6}$/i.test(v)){ t.classList.remove("bad"); c.value=v.toLowerCase(); onChange(v.toLowerCase()); } else t.classList.add("bad"); };
  t.onblur=()=>{ if(t.classList.contains("bad")){ t.value=c.value; t.classList.remove("bad"); } };
  w.appendChild(c); w.appendChild(t); return w;
}

// ---------- 初期化 ----------
document.getElementById("title").textContent = DATA.title;
document.title = DATA.title;
const notes=[];
if(!hasCourse){ document.getElementById("modeCourse").disabled=true; notes.push("CSVにコース列がないため、コース別は無効"); }
if(!hasBus){ document.getElementById("modeBus").disabled=true; notes.push("CSVに「大会バス利用」列がないため、バス利用者表示は無効"); }
document.getElementById("modeNote").textContent = notes.length? "（"+notes.join("／")+"）" : "";
// 所属列の幅を最長データに合わせる（全角1文字≒1em、半角≒0.55em）
(function(){ const w=Math.max(...rows.map(r=>[...String(r.club||"")].reduce((a,ch)=>a+(ch.charCodeAt(0)<256?0.55:1),0)),4);
  document.documentElement.style.setProperty("--clubw",(Math.min(w,30)+1.5)+"em"); })();
const dl=document.getElementById("nameList");
[...new Set(rows.map(r=>r.name).filter(Boolean))].sort().forEach(n=>{const o=document.createElement("option");o.value=n;dl.appendChild(o);});

document.querySelectorAll('input[name=mode]').forEach(el=>el.addEventListener("change",e=>setMode(e.target.value)));
document.getElementById("myName").addEventListener("input",e=>{myName=e.target.value.trim(); render();});
["winOn","winMin","clubQ","allQ","busOnly","cardMy","cardRental"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("showKana").addEventListener("change",()=>{ COLS=colset(mode).map(k=>Object.assign({key:k},COLDEF[k])); if(!COLS.some(c=>c.key===sortKey)){sortKey="time";sortAsc=true;} buildHeader(); render(); });
if(!hasBus) document.getElementById("busOnly").disabled=true;
function setMode(m){
  mode=m; COLS=colset(m).map(k=>Object.assign({key:k},COLDEF[k]));
  sortKey = (m==="bus")? "kana" : "time"; sortAsc=true; colFilter={};
  buildHeader(); buildGroupChecks(); buildColorGrid(); render();
}
function setMyName(v){ document.getElementById("myName").value=v; myName=v; render(); }
function resetFilters(){ colFilter={}; document.querySelectorAll("#flt input").forEach(i=>i.value=""); ["clubQ","allQ","myName"].forEach(id=>document.getElementById(id).value=""); myName=""; document.getElementById("winOn").checked=false; document.getElementById("busOnly").checked=false; document.getElementById("cardMy").checked=true; document.getElementById("cardRental").checked=true; checkAllGroups(true); }

function buildGroupChecks(){
  const box=document.getElementById("groupChecks"); box.innerHTML="";
  const gs=allGroups(); const ne={};
  gs.forEach(g=>{ ne[g]= (g in groupEnabled)? groupEnabled[g] : true;
    const l=document.createElement("label"); const c=document.createElement("input"); c.type="checkbox"; c.checked=ne[g];
    c.addEventListener("change",()=>{groupEnabled[g]=c.checked; render();});
    l.appendChild(c); l.appendChild(document.createTextNode(" "+titleLabel(g))); box.appendChild(l); });
  groupEnabled=ne;
}
function checkAllGroups(v){ allGroups().forEach(g=>groupEnabled[g]=v); document.querySelectorAll("#groupChecks input").forEach(c=>c.checked=v); render(); }

function buildColorGrid(){
  const row=document.getElementById("defColorRow"); row.innerHTML="";
  [["M","男子 既定"],["W","女子 既定"],["O","その他"]].forEach(([k,lab])=>{
    const l1=document.createElement("label"); l1.textContent=lab+" 背景 "; l1.appendChild(colorPair(defColors[k].stripe, v=>{defColors[k].stripe=v; saveColors(); render();})); row.appendChild(l1);
    const l2=document.createElement("label"); l2.textContent="タイトル "; l2.appendChild(colorPair(defColors[k].title, v=>{defColors[k].title=v; saveColors(); render();})); l2.style.marginRight="10px"; row.appendChild(l2);
  });
  const b=document.createElement("button"); b.textContent="既定に戻す"; b.onclick=resetColors; row.appendChild(b);
  const grid=document.getElementById("colorGrid"); grid.innerHTML="";
  const hd=(t)=>{const d=document.createElement("div");d.className="hd";d.textContent=t;grid.appendChild(d);};
  hd(mode==="course"?"レーン":"クラス"); hd("背景色（1行おき）"); hd("タイトル色");
  const gs = mode==="bus" ? ["バス利用者"] : allGroups();
  gs.forEach(g=>{
    const c=colorsOf(g);
    const n=document.createElement("div"); n.textContent=titleLabel(g); grid.appendChild(n);
    grid.appendChild(colorPair(c.stripe, v=>{(groupColors[g]=groupColors[g]||{}).stripe=v; saveColors(); render();}));
    grid.appendChild(colorPair(c.title,  v=>{(groupColors[g]=groupColors[g]||{}).title=v;  saveColors(); render();}));
  });
}
function resetColors(){ defColors=JSON.parse(JSON.stringify(DEF)); groupColors={}; saveColors(); buildColorGrid(); render(); }

// ---------- ヘッダ ----------
function buildHeader(){
  const h=document.getElementById("hdr"), f=document.getElementById("flt"); h.innerHTML=""; f.innerHTML="";
  COLS.forEach(c=>{
    const th=document.createElement("th"); th.className=c.cls; th.innerHTML=esc(c.label)+(sortKey===c.key?`<span class="arrow">${sortAsc?"▲":"▼"}</span>`:"");
    th.onclick=()=>{ if(sortKey===c.key) sortAsc=!sortAsc; else {sortKey=c.key; sortAsc=true;} buildHeader(); render(); };
    h.appendChild(th);
    const tf=document.createElement("th");
    if(c.key!=="cardnote" && c.key!=="bus"){ const inp=document.createElement("input"); inp.type="text"; inp.placeholder="フィルタ"; inp.value=colFilter[c.key]||"";
      inp.oninput=()=>{colFilter[c.key]=inp.value; render();}; tf.appendChild(inp); }
    f.appendChild(tf);
  });
}

// ---------- 描画 ----------
function render(){
  const winOn=document.getElementById("winOn").checked, winMin=+document.getElementById("winMin").value||0;
  const clubQ=norm(document.getElementById("clubQ").value.trim()), allQ=norm(document.getElementById("allQ").value.trim());
  const me = myName ? rows.find(r=>r.name===myName) || rows.find(r=>norm(r.name).includes(norm(myName))) : null;
  const center = me? me._min : null;
  const busOnly = document.getElementById("busOnly").checked;
  const cardMy = document.getElementById("cardMy").checked, cardRental = document.getElementById("cardRental").checked;
  const SEARCH_KEYS=["time","name","club","kana","card","cardnote","cls","course","no","bus"];

  let list = rows.filter(r=>{
    if((mode==="bus" || busOnly) && !isBus(r)) return false;
    if(isMyCard(r) ? !cardMy : !cardRental) return false;
    if(!groupEnabled[groupOf(r)]) return false;
    if(clubQ && !norm(r.club).includes(clubQ)) return false;
    if(allQ && !SEARCH_KEYS.some(k=>norm(r[k]).includes(allQ))) return false;
    for(const c of COLS){ const q=norm((colFilter[c.key]||"").trim()); if(q && !norm(r[c.key]).includes(q)) return false; }
    if(winOn && center!==null){ if(r._min===null) return false; if(Math.abs(r._min-center)>winMin) return false; }
    return true;
  });
  // 並べ替え（タイトル行グループ内）
  const cmp=(a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(sortKey==="time"){ va=a._min??1e9; vb=b._min??1e9; }
    else if(sortKey==="card"){ va=+va||va; vb=+vb||vb; }
    else { va=norm(va); vb=norm(vb); if(va===""&&vb!=="") return sortAsc?1:-1; if(vb===""&&va!=="") return sortAsc?-1:1; }
    let c = (typeof va==="number"&&typeof vb==="number")? va-vb : String(va).localeCompare(String(vb),"ja");
    if(c===0) c=(a._min??1e9)-(b._min??1e9) || a._i-b._i;
    return sortAsc? c : -c;
  };
  const titles = mode==="bus" ? ["バス利用者"] : allGroups();
  const by={}; list.forEach(r=>(by[titleOf(r)]=by[titleOf(r)]||[]).push(r));
  const tb=document.getElementById("body"); const parts=[];
  titles.forEach(g=>{
    const rs=by[g]; if(!rs) return; rs.sort(cmp); const col=colorsOf(g);
    parts.push(`<tr class="gtitle" style="background:${col.title}"><td colspan="${COLS.length}">${esc(titleLabel(g))}<span class="cnt">${rs.length}名</span></td></tr>`);
    rs.forEach((r,i)=>{
      const bg = i%2===1 ? ` style="background:${col.stripe}"` : "";
      const mine = me && r._i===me._i ? ' class="mine"' : "";
      parts.push(`<tr${mine}${bg}>`+COLS.map(c=>{
        let v = r[c.key]; if(c.key==="bus") v = isBus(r) ? "○" : "";
        return `<td class="${c.td||""}">${esc(v)}</td>`; }).join("")+`</tr>`);
    });
  });
  tb.innerHTML = parts.length? parts.join("") : `<tr><td colspan="${COLS.length}" class="empty">該当者がいません</td></tr>`;
  const tbl=document.getElementById("tbl"); tbl.classList.toggle("hasbus", hasBus && mode!=="bus"); tbl.classList.toggle("busmode", mode==="bus");
  const st=[`表示 ${list.length} 名 / 全 ${mode==="bus"? rows.filter(isBus).length+" 名（バス利用）" : rows.length+" 名"}`];
  if(myName && !me) st.push(`「${myName}」は見つかりません`);
  if(me) st.push(`自分：${me.name}（${me.cls}${me.time?" "+me.time:""}）`);
  if(winOn && me && center===null) st.push("自分のスタート時刻が未設定のため前後絞込みは無効");
  document.getElementById("status").textContent=st.join("　｜　");
  const MODE_LABEL={cls:"クラス別・スタート時刻順", course:"レーン別・スタート時刻順", bus:"大会バス利用者（ふりがな順）"};
  const sub=[MODE_LABEL[mode]];
  if(sortKey!==(mode==="bus"?"kana":"time")) sub.push(`${COLDEF[sortKey].label}順${sortAsc?"":"（降順）"}`);
  if(winOn&&me&&center!==null) sub.push(`${me.name} の前後${winMin}分`);
  if(clubQ) sub.push(`所属「${document.getElementById("clubQ").value.trim()}」`);
  if(busOnly && mode!=="bus") sub.push("バス利用者のみ");
  if(cardMy && !cardRental) sub.push("マイカードのみ"); if(!cardMy && cardRental) sub.push("レンタルカードのみ");
  document.getElementById("subtitle").textContent=sub.join("　／　");
}

setMode("cls");
</script>
</body>
</html>
